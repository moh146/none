name: Build Brutalize DLL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set DXSDK_DIR to local sdk folder
        shell: powershell
        run: |
          $dxPath = "${{ github.workspace }}\sdk"
          echo "DXSDK_DIR=$dxPath\" >> $env:GITHUB_ENV
          Write-Host "DXSDK_DIR set to: $dxPath"

      - name: Build solution (Release | Win32)
        shell: powershell
        run: |
          msbuild "Nebul engine.sln" /p:Configuration=Release /p:Platform=x86 /m /v:minimal

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brutalize-DLL
          path: bin/Brutalize.dll
          if-no-files-found: error
